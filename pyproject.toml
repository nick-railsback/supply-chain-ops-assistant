[project]
name = "supply-chain-ops-assistant"
version = "0.1.0"
description = "AI operations copilot for supply chain teams — natural language queries against OMS, WMS, and TMS APIs"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.121,<0.122",
    "fastapi>=0.141,<0.142",
    "uvicorn[standard]>=0.52,<0.53",
    "pydantic>=2.11,<3",
    "pydantic-settings>=2.13,<3",
    "httpx>=0.28,<0.29",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.22,<0.23",
    "structlog>=26.1,<27",
    "rich>=15,<16",
    "faker>=40.12,<41",
]

[dependency-groups]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=1.3,<2",
    "pytest-cov>=7.1,<8",
    "pytest-httpx>=0.36,<0.37",
    "ruff>=0.15,<0.16",
    "mypy>=2.3,<3",
    "pre-commit>=4.5,<5",
]

[tool.ruff]
target-version = "py311"
line-length = 100
exclude = ["_bmad", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.isort]
# Keep aliased imports in the same grouped `from x import (...)` block rather
# than splitting each `import as` onto its own statement.
combine-as-imports = true

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
strict = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "llm: tests that require LLM calls (deselect with '-m not llm')",
]
