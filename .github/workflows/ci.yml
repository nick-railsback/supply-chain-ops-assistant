name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A new advisory can land against an unchanged lockfile, so the push/PR
  # triggers alone can leave main quietly vulnerable for as long as nobody
  # commits. Re-scan weekly (Monday, after Renovate's lockfile refresh window)
  # so the OSV job reports on its own.
  schedule:
    - cron: "17 7 * * 1"
  workflow_dispatch:

# Least-privilege by default; jobs only read repo contents.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, type-check & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.11"
          enable-cache: true

      # --frozen: install exactly what uv.lock pins (hash-verified) and fail if
      # pyproject.toml and uv.lock have drifted. This is the supply-chain boundary.
      - name: Install dependencies (locked)
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Type-check
        run: uv run mypy agent models services seed cli config

      # Exclude live-LLM tests (they require an ANTHROPIC_API_KEY).
      - name: Tests
        run: uv run pytest -m "not llm"

      # Gate on the offline rule arm so interpreter regressions fail the build.
      # Thresholds sit a couple of points below the measured 52%/55% baseline.
      - name: Interpreter eval (rule arm, thresholded)
        run: uv run python -m evals.run_eval --arm rule --min-intent-accuracy 0.50 --min-systems-accuracy 0.52

  supply-chain:
    name: OSV vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Scans uv.lock against the OSV database and fails the build on any known
      # vulnerability. Renovate (renovate.json) opens the fix PRs.
      - name: Scan uv.lock with OSV-Scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=uv.lock
